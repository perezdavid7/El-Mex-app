<!-- v1.9.2 features: supplier ordering center, supplier order status, carry-forward, undo purchased, purchased history, IndexedDB persistence hooks, backward-compatible defaults -->
<script>
(function(){
  // Use the existing global state and functions from baseline.
  window.state = window.state || {};
  state.supplierOrderStatus = state.supplierOrderStatus || {};
  state.purchasedHistory = state.purchasedHistory || [];
  state.purchaseUndoStack = state.purchaseUndoStack || [];
  if(typeof state.carryForwardEnabled === 'undefined') state.carryForwardEnabled = true;

  // Keep originals
  const ORIGINAL_COMMIT = window.commitOrderStatus || function(x,s,r){};
  const ORIGINAL_RENDER = window.render || function(){};
  const ORIGINAL_START_NEW = window.startNewInventory || function(){};

  // Helper: record purchase
  function recordPurchase(x){
    try{
      if(!x) return;
      const rec = {id:x.id, name:x.name, supplier:x.supplier||'', caseOrder:x.caseOrder||0, unitOrder:x.unitOrder||0, unit:x.orderUnit||x.unit||'Each', time:Date.now()};
      state.purchasedHistory = state.purchasedHistory || [];
      state.purchasedHistory.push(rec);
      state.purchaseUndoStack = state.purchaseUndoStack || [];
      state.purchaseUndoStack.push({id:x.id, record:rec});
      save('Recorded purchase');
    }catch(e){console.error(e)}
  }

  // Override commitOrderStatus to augment history/undo
  window.commitOrderStatus = function(x,status,reason){
    ORIGINAL_COMMIT(x,status,reason);
    try{
      if(status==='purchased' && x){
        recordPurchase(x);
      }
      if(status==='open' && x){
        // remove any purchasedHistory entries for this id (reopen)
        state.purchasedHistory = (state.purchasedHistory||[]).filter(p=>p.id!==x.id);
      }
    }catch(e){console.error(e)}
    // trigger a render to update new screens
    try{render();}catch(e){if(ORIGINAL_RENDER)ORIGINAL_RENDER();}
  };

  // Undo purchased: revert most recent purchase for id
  window.undoPurchased = function(id){
    const x = byId(id);
    if(!x) return;
    // revert flags
    x.purchased = false;
    x.orderStatus = 'open';
    // remove last occurrence from purchasedHistory
    for(let i=(state.purchasedHistory||[]).length-1;i>=0;i--){
      if(state.purchasedHistory[i].id===id){ state.purchasedHistory.splice(i,1); break; }
    }
    save('Undo purchased');
    render();
  };

  // Supplier Ordering Center rendering
  window.renderSupplierOrders = function(){
    const active = (typeof activeItems==='function')? activeItems() : [];
    const bySup = {};
    active.forEach(it=>{ const s = it.supplier||'Unassigned'; (bySup[s]=bySup[s]||[]).push(it); });
    let body = `<div class="card"><div class="row"><button onclick="shareList()">📤 Share All</button><button onclick="saveHistory()">💾 Save List</button><button onclick="go('orders')">Back</button></div>`;
    const sups = Object.keys(bySup).sort((a,b)=>a.localeCompare(b));
    if(sups.length===0) body += '<div class="hint">No active items.</div>';
    sups.forEach(s=>{
      const status = (state.supplierOrderStatus||{})[s] || 'Needs Order';
      body += `<div class="supplierCard"><div class="supplierTab"><div><b>${esc(s)}</b><div class="small">Status: ${esc(status)}</div></div><div><button onclick="setSupplierOrderStatus(${js(s)},'Ordered')">Mark Ordered</button></div></div>`;
      bySup[s].forEach(i=>{
        body += `<div class="listLine"><div><b>${esc(i.name)}</b><div class="small">${(i.caseOrder||i.unitOrder)?('Qty: '+(i.caseOrder||i.unitOrder)):''}</div></div><div><button onclick="markPurchased(${i.id})">Purchased</button></div></div>`;
      });
      body += `</div>`;
    });
    body += `</div>`;
    shell('Supplier Ordering Center','Grouped by supplier',body);
  };

  window.setSupplierOrderStatus = function(s,status){ state.supplierOrderStatus = state.supplierOrderStatus||{}; state.supplierOrderStatus[s]=status; save('Supplier order status changed'); render(); };

  // Purchased history rendering
  window.renderPurchasedHistory = function(){
    const ph = state.purchasedHistory||[];
    let body = `<div class="card"><div class="row"><button onclick="go('orders')">Back</button></div>`;
    if(!ph.length) body += '<div class="hint">No purchased items in this trip.</div>';
    ph.forEach(p=>{
      body += `<div class="listLine"><div><b>${esc(p.name)}</b><div class="small">${esc(p.supplier||'')}</div></div><div><button onclick="undoPurchased(${p.id})">Undo</button></div></div>`;
    });
    body += `</div>`;
    shell('Purchased History','Items purchased during this trip',body);
  };

  // Augment render: add quick access buttons and screen routing
  window.render = function(){
    try{ ORIGINAL_RENDER(); }catch(e){console.error(e)}
    try{
      const head = document.querySelector('header .headrow');
      if(head && !document.getElementById('elmex_supplier_center')){
        const el = document.createElement('div'); el.id='elmex_supplier_center'; el.style.marginLeft='12px'; el.innerHTML = `<button class="small" onclick="go('supplierOrders')">Supplier Orders</button> <button class="small" onclick="go('purchasedHistory')">Purchased History</button>`;
        head.appendChild(el);
      }
      if(state.screen==='supplierOrders') renderSupplierOrders();
      if(state.screen==='purchasedHistory') renderPurchasedHistory();
    }catch(e){console.error(e)}
  };

  // Carry-forward: preserve carryover items when starting new inventory
  window.startNewInventory = function(){
    try{
      const carry = (items||[]).filter(i=>i.orderStatus==='carryover' && (Number(i.caseOrder||0)>0 || Number(i.unitOrder||0)>0));
      ORIGINAL_START_NEW();
      if(state.carryForwardEnabled && carry.length){
        carry.forEach(c=>{ const x=byId(c.id); if(x){ x.caseOrder = c.caseOrder; x.unitOrder = c.unitOrder; x.orderStatus='carryover'; } });
        save('Carryover reapplied');
      }
    }catch(e){console.error(e)}
    try{ render(); }catch(e){}
  };

  // Ensure IndexedDB persistence integration: if dbWrite exists, hook save to also write DB
  if(typeof dbWrite==='function'){
    const ORIGINAL_SAVE = window.save || function(reason){};
    window.save = function(reason){ const ok = ORIGINAL_SAVE(reason); try{ const snap = snapshot(); dbWrite(snap).catch(()=>{}); }catch(e){} return ok; };
  }

})();
</script>
